<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>写真ガチャ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2340d9;
    --coral:#ff5a4e;
    --ink:#0d1440;
    --r3:#6cc6ff;
    --r4:#c48bff;
    --r5:#ffc933;
    --display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{font-family:var(--body);font-weight:500;background:var(--blue);color:#fff;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}

  .screen{display:none;position:fixed;inset:0;overflow:auto;
    padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
  .screen.active{display:flex}

  /* ---------- TOP ---------- */
  #top{flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
  .capsule{position:relative;width:min(52vw,230px);aspect-ratio:1;border-radius:50%;
    background:linear-gradient(var(--coral) 0 50%,#fff 50% 100%);
    box-shadow:inset -16px -16px 0 rgba(13,20,64,.13),0 22px 0 -6px rgba(13,20,64,.28)}
  .capsule::before{content:"";position:absolute;left:0;right:0;top:calc(50% - 6px);height:12px;background:var(--ink)}
  .capsule::after{content:"";position:absolute;left:17%;top:13%;width:24%;height:11%;border-radius:50%;
    background:rgba(255,255,255,.75);transform:rotate(-38deg)}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,11vw,68px);line-height:1.05;letter-spacing:.02em}
  .lead{font-size:15px;opacity:.85;margin-top:8px}
  .rates{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .rates span{font-size:13px;padding:5px 12px;border-radius:99px;background:rgba(13,20,64,.35)}
  .rates b{font-weight:700;margin-right:4px}
  .rates .k3 b{color:var(--r3)} .rates .k4 b{color:var(--r4)} .rates .k5 b{color:var(--r5)}
  .btns{display:flex;flex-direction:column;gap:12px;width:min(360px,100%)}
  .btn{font-family:var(--display);font-size:22px;padding:17px 24px;border-radius:99px;letter-spacing:.04em;
    transition:transform .12s ease}
  .btn:active{transform:translateY(2px) scale(.98)}
  .btn.one{background:#fff;color:var(--blue)}
  .btn.ten{background:var(--coral);color:#fff;box-shadow:0 5px 0 rgba(13,20,64,.3)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .notice{font-size:14px;line-height:1.7;background:rgba(13,20,64,.4);padding:14px 18px;border-radius:12px;max-width:380px}

  /* ---------- REVEAL ---------- */
  #reveal{flex-direction:column;align-items:center;justify-content:space-between;text-align:center;cursor:pointer;
    --c:var(--r3);background:radial-gradient(circle at 50% 40%,#2d7fe0 0%,#12296e 100%)}
  #reveal[data-rarity="4"]{--c:var(--r4);background:radial-gradient(circle at 50% 40%,#8a4df0 0%,#2a1268 100%)}
  #reveal[data-rarity="5"]{--c:var(--r5);background:radial-gradient(circle at 50% 40%,#ffb320 0%,#8a3a00 100%)}
  .rv-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:2}
  .rv-count{font-size:15px;min-width:60px;text-align:left}
  .skip{font-size:14px;padding:8px 16px;border-radius:99px;background:rgba(13,20,64,.4)}
  .stars{font-family:var(--display);font-size:clamp(30px,8vw,46px);letter-spacing:.08em;color:var(--c);
    text-shadow:0 2px 0 rgba(13,20,64,.35);z-index:2;margin-top:6px}
  .stars.go{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;z-index:1;padding:10px 0}
  .stage video{max-width:92vw;max-height:62vh;border-radius:14px;border:4px solid var(--c);background:#000;
    box-shadow:0 0 0 0 transparent,0 10px 40px rgba(0,0,0,.35)}
  #reveal[data-rarity="5"] .stage video{box-shadow:0 0 36px 6px rgba(255,201,51,.7),0 10px 40px rgba(0,0,0,.35)}
  .missing{padding:40px 28px;border-radius:14px;border:3px dashed var(--c);font-size:14px;line-height:1.8;word-break:break-all}
  .rv-foot{z-index:2;min-height:64px}
  .rv-name{font-size:18px;font-weight:700;margin-bottom:6px}
  .rv-hint{font-size:13px;opacity:.85}
  .burst{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;
    background:radial-gradient(circle at 50% 45%,#fff 0%,var(--c) 22%,transparent 62%)}
  .burst.go{animation:burst .9s ease-out}
  @keyframes burst{0%{opacity:.95;transform:scale(.2)}100%{opacity:0;transform:scale(2.4)}}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  .sound-hint{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:4;
    background:#fff;color:var(--ink);font-weight:700;font-size:14px;padding:10px 18px;border-radius:99px}

  /* ---------- RESULT ---------- */
  #result{flex-direction:column;align-items:center;gap:20px;background:var(--blue)}
  #result h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,7vw,44px)}
  .summary{display:flex;gap:14px;font-size:15px}
  .summary .k3{color:var(--r3)} .summary .k4{color:var(--r4)} .summary .k5{color:var(--r5)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:min(1100px,100%)}
  .tile{--c:var(--r3);display:flex;flex-direction:column;text-align:left;background:rgba(13,20,64,.4);
    border-radius:12px;overflow:hidden;border:3px solid var(--c);transition:transform .12s ease}
  .tile[data-rarity="4"]{--c:var(--r4)} .tile[data-rarity="5"]{--c:var(--r5);box-shadow:0 0 18px rgba(255,201,51,.6)}
  .tile:active{transform:scale(.98)}
  .tile video,.tile .missing{width:100%;aspect-ratio:1;object-fit:cover;background:#000;display:block}
  .tile .missing{display:flex;align-items:center;justify-content:center;border:0;border-radius:0;padding:8px;font-size:11px;text-align:center}
  .tile .cap{padding:8px 10px;font-size:13px;line-height:1.35}
  .tile .cap i{font-style:normal;color:var(--c);display:block;letter-spacing:.06em}
  .tile .cap span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding-bottom:8px}
  .r-btns .btn{font-size:18px;padding:14px 28px}
  .btn.ghost{background:rgba(13,20,64,.4);color:#fff}

  /* ---------- LIGHTBOX ---------- */
  #lightbox{position:fixed;inset:0;z-index:10;background:rgba(13,20,64,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:20px;--c:var(--r3)}
  #lightbox[data-rarity="4"]{--c:var(--r4)} #lightbox[data-rarity="5"]{--c:var(--r5)}
  #lbStage video{max-width:92vw;max-height:72vh;border-radius:14px;border:4px solid var(--c);background:#000}
  #lbName{font-weight:700;font-size:16px}
  #lbName i{font-style:normal;color:var(--c);margin-right:8px}
  .lb-close{font-size:14px;padding:9px 22px;border-radius:99px;background:#fff;color:var(--ink);font-weight:700}

  @media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (prefers-reduced-motion:reduce){.burst.go,.stars.go{animation:none}.btn,.tile{transition:none}}
</style>
</head>
<body>

<section id="top" class="screen active">
  <div class="capsule" aria-hidden="true"></div>
  <div>
    <h1>写真ガチャ</h1>
    <p class="lead">回数を選んでガチャを引く</p>
  </div>
  <div class="rates" id="rates"></div>
  <div class="btns">
    <button class="btn one" id="pull1">1連</button>
    <button class="btn ten" id="pull10">10連</button>
  </div>
  <p class="notice" id="notice" hidden>カードがまだありません。cards.js にファイル名（例：s3_名前.mp4）を追加してください。</p>
</section>

<section id="reveal" class="screen" data-rarity="3">
  <div class="rv-head">
    <span class="rv-count" id="rvCount"></span>
    <button class="skip" id="skip">結果へスキップ</button>
  </div>
  <div class="stars" id="stars"></div>
  <div class="stage" id="stage"></div>
  <div class="rv-foot">
    <p class="rv-name" id="rvName"></p>
    <p class="rv-hint" id="rvHint"></p>
  </div>
  <div class="burst" id="burst"></div>
  <div class="sound-hint" id="soundHint" hidden>タップで音を出す</div>
</section>

<section id="result" class="screen">
  <h2>結果</h2>
  <div class="summary" id="summary"></div>
  <div class="grid" id="grid"></div>
  <div class="r-btns">
    <button class="btn one" id="again"></button>
    <button class="btn ghost" id="home">トップへ</button>
  </div>
</section>

<div id="lightbox" hidden>
  <div id="lbStage"></div>
  <p id="lbName"></p>
  <button class="lb-close" id="lbClose">閉じる</button>
</div>

<script src="config.js"></script>
<script src="cards.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const CFG = Object.assign({ folder: "videos/", rates: { 5: 1, 4: 3, 3: 96 } }, window.GACHA_CONFIG || {});
  const FILES = window.GACHA_CARDS || [];

  // ファイル名 → カード情報（s3_/s4_/s5_ の数字がレア度）
  const cards = [];
  FILES.forEach(f => {
    const m = /^s([345])_(.+)\.mp4$/i.exec(f);
    if (!m) { console.warn("ファイル名のルールに合わないためスキップ:", f); return; }
    cards.push({ file: f, rarity: +m[1], name: m[2].normalize("NFC"), src: CFG.folder + encodeURIComponent(f) });
  });
  const byRarity = { 3: [], 4: [], 5: [] };
  cards.forEach(c => byRarity[c.rarity].push(c));

  const stars = n => "★".repeat(n);
  let pulls = [], idx = 0, lastN = 1, pendingUnmute = null;

  // ---------- 排出 ----------
  function pickRarity() {
    const r = CFG.rates, total = (r[5] || 0) + (r[4] || 0) + (r[3] || 0);
    const x = Math.random() * total;
    if (x < (r[5] || 0)) return 5;
    if (x < (r[5] || 0) + (r[4] || 0)) return 4;
    return 3;
  }
  function pullOne() {
    const want = pickRarity();
    // そのレア度のカードが無いときは、近いレア度から代わりに出す
    const order = [want, ...[5, 4, 3].filter(k => k !== want).sort((a, b) => Math.abs(a - want) - Math.abs(b - want))];
    for (const k of order) {
      if (byRarity[k].length) return byRarity[k][Math.floor(Math.random() * byRarity[k].length)];
    }
    return null;
  }

  // ---------- 動画 ----------
  function missingEl(c) {
    const d = document.createElement("div");
    d.className = "missing";
    d.textContent = "動画が見つかりません：" + c.file;
    return d;
  }
  function makeVideo(c, { sound = false, onNeedSound } = {}) {
    const v = document.createElement("video");
    v.loop = true;
    v.playsInline = true;
    v.setAttribute("playsinline", "");
    v.preload = "auto";
    v.muted = !(sound && c.rarity === 5);   // 音が出るのは星5だけ
    v.addEventListener("error", () => v.replaceWith(missingEl(c)));
    v.src = c.src;
    const p = v.play();
    if (p && p.catch) p.catch(() => {
      if (!v.muted) {                        // 音つき再生をブラウザに止められたとき
        v.muted = true;
        v.play().catch(() => {});
        if (onNeedSound) onNeedSound(v);
      }
    });
    return v;
  }
  function releaseVideos(root) {
    root.querySelectorAll("video").forEach(v => { v.pause(); v.removeAttribute("src"); v.load(); });
    root.innerHTML = "";
  }
  function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  // ---------- 画面 ----------
  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  }

  function draw(n) {
    if (!cards.length) return;
    lastN = n;
    pulls = Array.from({ length: n }, pullOne);
    idx = 0;
    show("reveal");
    showCard();
  }

  function showCard() {
    const c = pulls[idx];
    pendingUnmute = null;
    $("soundHint").hidden = true;
    releaseVideos($("stage"));
    $("reveal").dataset.rarity = c.rarity;
    $("stars").textContent = stars(c.rarity);
    $("rvName").textContent = c.name;
    $("rvCount").textContent = pulls.length > 1 ? `${idx + 1} / ${pulls.length}` : "";
    $("rvHint").textContent = idx < pulls.length - 1 ? "タップで次へ" : "タップで結果へ";
    restart($("burst"), "go");
    restart($("stars"), "go");
    $("stage").appendChild(makeVideo(c, {
      sound: true,
      onNeedSound: v => { pendingUnmute = v; $("soundHint").hidden = false; }
    }));
  }

  function showResult() {
    pendingUnmute = null;
    $("soundHint").hidden = true;
    releaseVideos($("stage"));
    const grid = $("grid");
    releaseVideos(grid);

    const cnt = { 3: 0, 4: 0, 5: 0 };
    pulls.forEach(c => {
      cnt[c.rarity]++;
      const t = document.createElement("button");
      t.className = "tile";
      t.dataset.rarity = c.rarity;
      t.appendChild(makeVideo(c));           // 結果一覧は音なし
      const cap = document.createElement("div");
      cap.className = "cap";
      cap.innerHTML = "<i></i><span></span>";
      cap.querySelector("i").textContent = stars(c.rarity);
      cap.querySelector("span").textContent = c.name;
      t.appendChild(cap);
      t.addEventListener("click", () => openLightbox(c));
      grid.appendChild(t);
    });
    $("summary").innerHTML =
      `<span class="k5">★5 ×${cnt[5]}</span><span class="k4">★4 ×${cnt[4]}</span><span class="k3">★3 ×${cnt[3]}</span>`;
    $("again").textContent = `もう一度 ${lastN}連`;
    show("result");
  }

  function openLightbox(c) {
    const lb = $("lightbox");
    lb.dataset.rarity = c.rarity;
    releaseVideos($("lbStage"));
    $("lbStage").appendChild(makeVideo(c, { sound: true }));
    $("lbName").innerHTML = "<i></i><span></span>";
    $("lbName").querySelector("i").textContent = stars(c.rarity);
    $("lbName").querySelector("span").textContent = c.name;
    lb.hidden = false;
  }
  function closeLightbox() {
    releaseVideos($("lbStage"));
    $("lightbox").hidden = true;
  }

  // ---------- イベント ----------
  $("pull1").addEventListener("click", () => draw(1));
  $("pull10").addEventListener("click", () => draw(10));

  $("reveal").addEventListener("click", () => {
    if (pendingUnmute) {
      pendingUnmute.muted = false;
      pendingUnmute.play().catch(() => {});
      pendingUnmute = null;
      $("soundHint").hidden = true;
      return;
    }
    if (idx < pulls.length - 1) { idx++; showCard(); } else showResult();
  });
  $("skip").addEventListener("click", e => { e.stopPropagation(); showResult(); });

  $("again").addEventListener("click", () => { releaseVideos($("grid")); draw(lastN); });
  $("home").addEventListener("click", () => { releaseVideos($("grid")); show("top"); });

  $("lbClose").addEventListener("click", closeLightbox);
  $("lightbox").addEventListener("click", e => { if (e.target === $("lightbox")) closeLightbox(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("lightbox").hidden) closeLightbox(); });

  // ---------- 初期表示 ----------
  const r = CFG.rates, total = (r[5] || 0) + (r[4] || 0) + (r[3] || 0) || 1;
  const pct = k => Math.round((r[k] || 0) / total * 1000) / 10;
  $("rates").innerHTML =
    `<span class="k5"><b>★5</b>${pct(5)}%</span><span class="k4"><b>★4</b>${pct(4)}%</span><span class="k3"><b>★3</b>${pct(3)}%</span>`;
  if (!cards.length) {
    $("notice").hidden = false;
    $("pull1").disabled = $("pull10").disabled = true;
  }
})();
</script>
</body>
</html>
